format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$python\
$os\
$shell\
$sudo\
"""
[directory]
truncation_length = 8
[hostname]
disabled = false
ssh_only = false
format = '[$ssh_symbol$hostname]($style):'
[package]
disabled = true
[python]
format = '[${symbol}${pyenv_prefix}(\($virtualenv\) )]($style)'
symbol = ''
[sudo]
disabled = true
